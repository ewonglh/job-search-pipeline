# Posting gates: companies whose postings are held back from tailoring and
# discovery selection until a date, with the reason.
#
# Use this when a company caps applications per window, or when you want to
# pause a company without editing the posting store.
#
# Fields:
#   company_aliases: [str] - company names to match (case/space-insensitive).
#   host:            str   - (optional) posting-link host suffix to match,
#                            e.g. "jobs.example.com" (matches subdomains).
#   gate_until:      str   - ISO date (YYYY-MM-DD); gate expires after it.
#   reason:          str   - why the gate exists.
#
# Remove the entry (or let gate_until pass) to lift the gate. This file ships
# empty by default: an empty gate list is valid.

# Example (uncomment and edit):
# - company_aliases: [Example Corp, Example Corp Labs]
#   host: jobs.example.com
#   gate_until: "2027-01-01"
#   reason: >-
#     Example Corp caps applications at 2 per 6-month window per the portal
#     banner. Hold further postings until the window rolls over, then confirm
#     the banner shows a fresh window before removing.
[]